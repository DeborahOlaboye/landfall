[project]
name = "landfall"
description = "Direct giving with proof of arrival, on Stacks."
authors = []
telemetry = true
cache_dir = "./.cache"

[contracts.sip-010-trait]
path = "contracts/sip-010-trait.clar"
clarity_version = 3
epoch = 3.1

[contracts.recipient-registry]
path = "contracts/recipient-registry.clar"
clarity_version = 3
epoch = 3.1

[contracts.landfall]
path = "contracts/landfall.clar"
clarity_version = 3
epoch = 3.1

[repl.analysis]
passes = ["check_checker"]
# trusted_sender: every privileged path here authenticates tx-sender against
# the steward or the owning organizer before touching its arguments, so inputs
# from an already-verified sender are trusted. Callers remain untrusted.
check_checker = { trusted_sender = true, trusted_caller = false, callee_filter = false }

# Check-checker settings:
# trusted_sender: if true, inputs are trusted after tx_sender has been checked.
# trusted_caller: if true, inputs are trusted after contract-caller has been checked.
# callee_filter: if true, untrusted data may be passed into a private function without a
# warning, if it gets checked inside. This check will also propagate up to the
# caller.
# More informations: https://www.hiro.so/blog/new-safety-checks-in-clarinet
